name: 03 - K8s Cluster Config & App Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Target Environment'
        required: true
        default: 'demo'
        options:
          - demo
          - test
          - prod

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: demo-eks
  ECR_REPOSITORY: ${{ github.event.inputs.environment }}-app-repo

jobs:
  kubernetes-deployment-stage:
    name: "K8s Cluster Config & App Deploy (${{ github.event.inputs.environment }})"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Helm CLI
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Step 3.1 - Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Step 3.2 - Join Worker Nodes (aws-auth)
        run: |
          echo "=== Fetching Worker Node IAM Role ARN ==="
          NODE_ROLE_ARN="arn:aws:iam::651901885850:role/eksworkernoderole"
          
          # Fallback to dynamic lookup if specific role ARN is unavailable
          if [ -z "$NODE_ROLE_ARN" ]; then
            NODE_ROLE_ARN=$(aws iam list-roles --query "Roles[?contains(RoleName, '${{ env.EKS_CLUSTER_NAME }}') || contains(RoleName, 'eksworkernoderole')].Arn" --output text | head -n 1)
          fi

          echo "Applying node authentication for IAM Role: ${NODE_ROLE_ARN}"

          # Create aws-auth ConfigMap dynamically
          cat <<CMEOF > aws-auth-cm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - rolearn: ${NODE_ROLE_ARN}
      username: system:node:{{EC2PrivateDNSName}}
      groups:
        - system:bootstrappers
        - system:nodes
CMEOF

          kubectl apply -f aws-auth-cm.yaml
          
          echo "=== Waiting 30s for Worker Nodes to Register ==="
          sleep 30
          kubectl get nodes -o wide

      - name: Step 3.3 - Install Metrics Server & Lightweight Observability Stack
        run: |
          for i in {1..3}; do
            helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/ && \
            helm repo add prometheus-community https://prometheus-community.github.io/helm-charts && break || sleep 3
          done
          helm repo update

          kubectl delete apiservice v1beta1.metrics.k8s.io --wait=false --ignore-not-found=true

          helm upgrade --install metrics-server metrics-server/metrics-server \
            --namespace kube-system \
            --set apiService.create=false \
            --set hostNetwork.enabled=true \
            --set args="{--kubelet-insecure-tls,--kubelet-preferred-address-types=InternalIP}"

          kubectl delete secret -n monitoring -l "owner=helm,name=prometheus" --ignore-not-found=true

          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --no-hooks \
            --set grafana.enabled=true \
            --set alertmanager.enabled=false \
            --set prometheus.prometheusSpec.resources.requests.cpu="10m" \
            --set prometheus.prometheusSpec.resources.requests.memory="128Mi" \
            --set prometheus.prometheusSpec.scrapeInterval="15s"

          kubectl delete ns logging --ignore-not-found=true --wait=false

      - name: Step 3.4 - Deploy Base Setup, Security Controls & Observability Resources
        run: |
          kubectl apply -f eks/k8s/base-setup.yaml
          kubectl apply -f eks/k8s/rbac.yaml
          kubectl apply -f eks/k8s/network-policy.yaml
          
          kubectl apply -f eks/k8s/observability/prometheus-rules.yaml
          kubectl apply -f eks/k8s/observability/grafana-dashboard-cm.yaml
          kubectl apply -f eks/k8s/observability/alertmanager-routing.yaml

      - name: Step 3.5 - Deploy App Workloads to Selected Environment Namespace
        run: |
          TARGET_NS="${{ github.event.inputs.environment }}-apps"
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest"

          kubectl create ns ${TARGET_NS} --dry-run=client -o yaml | kubectl apply -f -
          sed -i '/^[[:space:]]*namespace:/d' eks/k8s/app/*.yaml

          if ! aws ecr describe-images --repository-name ${{ env.ECR_REPOSITORY }} --image-ids imageTag=latest --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "WARNING: ECR image not found! Falling back to nginx:alpine for fast startup..."
            ECR_IMAGE="nginx:alpine"
          fi

          sed -i "s|image: nginx:latest|image: ${ECR_IMAGE}|g" eks/k8s/app/deployment.yaml

          kubectl apply -f eks/k8s/app/configmap.yaml -n ${TARGET_NS}
          kubectl apply -f eks/k8s/app/secret.yaml -n ${TARGET_NS}
          kubectl apply -f eks/k8s/app/resource-limits.yaml -n ${TARGET_NS}
          kubectl apply -f eks/k8s/app/deployment.yaml -n ${TARGET_NS}
          kubectl apply -f eks/k8s/app/service.yaml -n ${TARGET_NS}
          kubectl apply -f eks/k8s/app/hpa.yaml -n ${TARGET_NS}
          kubectl apply -f eks/k8s/app/ingress.yaml -n ${TARGET_NS}

      - name: Step 3.6 - Validate Cluster Workloads & Observability Status
        run: |
          echo "=== 1. Checking Node Status ==="
          kubectl get nodes

          echo "=== 2. Checking Application Workloads ==="
          kubectl get pods,svc,hpa,ingress -n ${{ github.event.inputs.environment }}-apps

          echo "=== 3. Checking Monitoring Stack Status ==="
          kubectl get pods,svc -n monitoring
