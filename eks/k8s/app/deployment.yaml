apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-app
  namespace: prod-apps
  labels:
    app: prod-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prod-app
  template:
    metadata:
      labels:
        app: prod-app
    spec:
      containers:
      - name: web-app
        image: nginx:latest
        ports:
        - containerPort: 80
        # Resource Requests & Limits
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        # Health Probes Configuration
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        # ConfigMap & Secret Integration
        envFrom:
        - configMapRef:
            name: prod-app-config
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: prod-app-secret
              key: API_KEY
