apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: prod-apps
  name: app-developer-role
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "deployments", "services"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-app-developer
  namespace: prod-apps
subjects:
- kind: ServiceAccount
  name: prod-app-sa
  namespace: prod-apps
roleRef:
  kind: Role
  name: app-developer-role
  apiGroup: rbac.authorization.k8s.io
